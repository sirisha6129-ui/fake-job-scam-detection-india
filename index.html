<!DOCTYPE html>
<html>
<head>
    <title>Fake Job Scam Detection</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Fake Job & Internship Scam Detection</h1>
    <form method="POST">
        <textarea name="job_text" placeholder="Paste job text here" required></textarea><br>
        <button type="submit">Check Scam</button>
    </form>
    {% if result %}
        <h2>{{ result }}</h2>
    {% endif %}
</body>
</html>
